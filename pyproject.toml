[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aophoton"
version = "0.1.0"
description = "An independent AO–photonic spectrograph conceptual performance simulator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xu Han"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6"]

[project.optional-dependencies]
fits = ["astropy>=5.3"]
dev = ["pytest>=7", "astropy>=5.3", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[project.scripts]
aophoton = "aophoton.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

